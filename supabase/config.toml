# Supabase CLI config — HOUSE-ZEN
# Fonctions avec auth applicative propre (dual-auth API-key/JWT pour api-v1,
# service-role/cron-secret pour notification-dispatcher) : la vérification JWT
# de la plateforme est désactivée — le code effectue ses propres contrôles.
project_id = "House-zen"

# Parité avec la config GoTrue appliquée en prod (scripts/auth-config.mjs) :
# site_url = domaine de production ; allow list = prod + serveurs de dev Vite
# (dev 5173 / preview 4173). L'app n'utilise aucun redirectTo aujourd'hui —
# la liste reste volontairement stricte (anti open-redirect).
[auth]
site_url = "https://house-zen.vercel.app"
additional_redirect_urls = [
  "https://house-zen.vercel.app/**",
  "http://localhost:5173/**",
  "http://localhost:4173/**",
]

[functions.api-v1]
verify_jwt = false

[functions.notification-dispatcher]
verify_jwt = false
